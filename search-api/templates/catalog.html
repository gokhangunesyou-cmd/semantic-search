<!doctype html>
<html lang="tr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ürün arama</title>
  <link rel="stylesheet" href="/assets/catalog.css">
  <script src="/assets/catalog.js?v=4" defer></script>
</head>

<body>
  <main>
    <header>
      <h1>Ürün arama</h1>
      <a href="/docs">API dokümanı</a>
    </header>
    <form id="search-form" method="get">
      <label for="query">Arama</label>
      <div class="searchbox">
        <input id="query" name="query" type="search" placeholder="Ürün adı veya arama metni" required maxlength="2000"
          autocomplete="off">
        <button type="submit">Ara</button>
      </div>
      <div class="options">
        <label for="limit">Sayfa başına ürün
          <select id="limit" name="limit">
            <option value="5">5</option>
            <option value="12">12</option>
            <option value="24">24</option>
            <option value="50">50</option>
          </select>
        </label>
      </div>
      <fieldset class="weights">
        <legend>Skor ağırlıkları</legend>
        <label for="weight-semantic">Ana metin (semantic.text)
          <input id="weight-semantic" name="weight_semantic" type="number" min="0" max="10" step="any"
            value="1" required>
        </label>
        <label for="weight-name">Ürün adı (semantic.v2.name)
          <input id="weight-name" name="weight_name" type="number" min="0" max="10" step="any"
            value="0.4" required>
        </label>
        <label for="weight-category">Kategori (semantic.v2.category)
          <input id="weight-category" name="weight_category" type="number" min="0" max="10" step="any"
            value="0.5" required>
        </label>
        <label for="weight-brand">Marka (semantic.v2.brand)
          <input id="weight-brand" name="weight_brand" type="number" min="0" max="10" step="any"
            value="0.1" required>
        </label>
      </fieldset>
      <fieldset class="document-score-options">
        <legend>DocumentScore etkisi</legend>
        <label class="document-score-toggle" for="include-document-score">
          <input id="include-document-score" name="include_document_score" type="checkbox" value="1">
          Relevance × documentScore çarpanı
        </label>
        <label for="document-score-max-multiplier">Azami çarpan
          <input id="document-score-max-multiplier" name="document_score_max_multiplier" type="number"
            min="1" max="10" step="0.01" value="1.20" disabled required>
        </label>
        <p>200 ve üzeri documentScore azami çarpana ulaşır. 1.20 en fazla %20 artış demektir.</p>
      </fieldset>
    </form>
    <section class="results" aria-labelledby="results-title" aria-busy="false">
      <div class="results-heading">
        <h2 id="results-title">Sonuçlar</h2>
        <span id="result-meta"></span>
        <button id="response-button" type="button" disabled>Tüm API yanıtı</button>
      </div>
      <p class="score-note">Score sıralama puanıdır, yüzde değildir.</p>
      <p id="status" role="status" aria-live="polite">Ürünleri görmek için arama yapın.</p>
      <div id="products"></div>
      <nav id="pagination" class="pagination" aria-label="Sonuç sayfaları" hidden>
        <button id="previous-page" type="button">Önceki</button>
        <span id="page-label"></span>
        <button id="next-page" type="button">Sonraki</button>
      </nav>
    </section>
  </main>
  <dialog id="data-dialog" aria-labelledby="data-title">
    <div class="dialog-heading">
      <h2 id="data-title">API verisi</h2>
      <form method="dialog"><button>Kapat</button></form>
    </div>
    <pre id="data-content" tabindex="0"></pre>
  </dialog>
</body>

</html>
