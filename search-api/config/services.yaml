services:
  _defaults: { autowire: true, autoconfigure: true }
  App\:
    resource: '../src/'
    exclude:
      - '../src/Kernel.php'
      - '../src/Service/V2/Search/SearchInput.php'
      - '../src/Service/V2/Search/QueryBuilder/Filter/'
  PDO:
    class: PDO
    factory: ['App\Service\Database', 'connect']
  Symfony\Contracts\HttpClient\HttpClientInterface:
    class: Symfony\Component\HttpClient\HttpClient
    factory: ['Symfony\Component\HttpClient\HttpClient', 'create']