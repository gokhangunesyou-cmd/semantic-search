name: semantic-search
services:
  postgres:
    image: postgres:16.13-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-semantic}
    command: [ "postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=20", "-c", "wal_level=logical" ]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 384m
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka-data-init:
    image: apache/kafka:4.3.1
    user: "0:0"
    entrypoint: [ "/bin/sh", "-c" ]
    command: [ "chown 1000:1000 /var/lib/kafka/data" ]
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: "no"

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: iG3pBaysT2-mjvYqEhlyZg
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      kafka-data-init: { condition: service_completed_successfully }
    mem_limit: 1g
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092" ]
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: semantic-search
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFBAT_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFBAT_PASSWORD:?required}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
    depends_on:
      kafka: { condition: service_healthy }
    mem_limit: 768m
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.19.14
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      path.repo: /usr/share/elasticsearch/snapshots
      ES_JAVA_OPTS: -Xms1536m -Xmx1536m
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?required}
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
      - elastic_snapshots:/usr/share/elasticsearch/snapshots
    mem_limit: 3g
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health >/dev/null" ]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  model-init:
    build:
      context: .
      dockerfile: embedding-api/Dockerfile
    command: [ "python", "download_model.py" ]
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-}
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - model_data:/models
    mem_limit: 512m
    restart: "no"

  embedding:
    build:
      context: .
      dockerfile: embedding-api/Dockerfile
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-}
      MODEL_FILE: ${MODEL_FILE:-onnx/model.onnx}
      INFERENCE_THREADS: "2"
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - model_data:/models
    mem_limit: 3g
    cpus: 2
    depends_on:
      model-init: { condition: service_completed_successfully }
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')" ]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 5
    restart: unless-stopped

  search-api:
    build:
      context: .
      dockerfile: search-api/Dockerfile
    # schema.sql is baked into this image; no host-side SQL bind mount is needed.
    command: [ "sh", "-c", "php bin/console app:db:init && exec apache2-foreground" ]
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?required}
      DATABASE_DSN: pgsql:host=postgres;port=5432;dbname=${POSTGRES_DB:-semantic}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:?required}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-products_v1}
      ELASTICSEARCH_ALIAS: ${ELASTICSEARCH_ALIAS:-products_current}
      EMBEDDING_URL: http://embedding:8000
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-}
      MODEL_FILE: ${MODEL_FILE:-onnx/model.onnx}
    volumes:
      - import_data:/data
    expose: [ "80" ]
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      embedding: { condition: service_healthy }
    mem_limit: 768m
    healthcheck:
      test: [ "CMD", "php", "-r", "exit(@file_get_contents('http://localhost/health/ready') === false ? 1 : 0);" ]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
  elastic_data:
  elastic_snapshots:
  model_data:
  import_data:
